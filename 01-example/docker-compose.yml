services:
  php:
    build: ./backend
    container_name: php-backend
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:80"
    env_file:
      - .env
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo_db
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"

  frontend:
    image: nginx:alpine
    container_name: frontend
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "8080:80"